services:
  - type: web
    name: pearldent-clinic
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix server && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: Paulo@gmail.com
      - key: ADMIN_PASSWORD
        sync: false